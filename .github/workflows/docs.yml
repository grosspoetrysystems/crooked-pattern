# Publishes the living Poolboy corpus mirror from main to GitHub Pages.
# The release workflow separately deploys the published npm package's corpus.
# `site/` is output because `dist/` is this package's compiled JavaScript.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: poolboy-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Poolboy corpus
        run: |
          npx --yes @grosspoetrysystems/poolboy@0.3.0 check
          npx --yes @grosspoetrysystems/poolboy@0.3.0 build
      - name: Record corpus revision
        run: |
          REVISION="$(sha256sum site/graph.json | cut -d ' ' -f 1)"
          echo "Poolboy corpus revision: ${REVISION}"
          echo "Poolboy corpus revision: ${REVISION}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
