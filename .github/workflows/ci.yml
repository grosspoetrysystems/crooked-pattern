name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Least privilege by default; no job needs write access.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm coverage
      # Dogfood: scan this repo with the scanner it ships. A crash or a
      # regressed supply-chain posture on our own code fails the build.
      - name: Self-scan (dogfood)
        run: |
          node dist/cli.js scan --source . --out .tempor/ci-selfscan
          echo '::group::ars self-scan report'
          cat .tempor/ci-selfscan/ars-report.md
          echo '::endgroup::'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ars-selfscan
          path: .tempor/ci-selfscan/

  # Blocks pull requests that introduce known-vulnerable or disallowed
  # dependencies before they can be merged (supply-chain injection guard).
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
